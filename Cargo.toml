[package]
name = "live-sport"
version = "0.1.13"
edition = "2024"

[dependencies]
wry = "0.57"
tao = "0.34"
reqwest = { version = "0.12", features = ["blocking", "json"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
unicode-normalization = "0.1"
semver = "1"
sha2 = "0.10"

[profile.release]
strip = true
lto = "thin"

[build-dependencies]
winresource = "0.1"
